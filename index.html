<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFE — Consejo Familiar Electoral</title>

<style>
:root{
    --blue:#0757a0;
    --blue-dark:#063b70;
    --blue-light:#eaf3fb;
    --gold:#d9a928;
    --white:#ffffff;
    --gray:#64748b;
    --light:#f4f7fb;
    --border:#dce4ee;
    --green:#159447;
    --red:#c93636;
    --shadow:0 8px 25px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--light);
    color:#172033;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* LOGIN */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:
        linear-gradient(135deg,#063b70,#0871c9);
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.logo-cfe{
    width:70px;
    height:70px;
    border-radius:16px;
    background:linear-gradient(135deg,var(--blue),#0b75ce);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:24px;
    margin:0 auto 18px;
    border-bottom:5px solid var(--gold);
}

.login-box h1{
    text-align:center;
    margin:0;
    font-size:25px;
}

.login-box p{
    text-align:center;
    color:var(--gray);
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    font-size:14px;
}

input,
textarea,
select{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:white;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--blue);
}

textarea{
    min-height:100px;
    resize:vertical;
}

.primary{
    background:var(--blue);
    color:white;
    border:0;
    border-radius:10px;
    padding:12px 18px;
    font-weight:bold;
}

.primary:hover{
    background:var(--blue-dark);
}

.secondary{
    background:white;
    color:var(--blue);
    border:1px solid var(--blue);
    border-radius:10px;
    padding:11px 17px;
    font-weight:bold;
}

.danger{
    background:var(--red);
    color:white;
    border:0;
    border-radius:10px;
    padding:11px 17px;
    font-weight:bold;
}

.success{
    background:var(--green);
    color:white;
    border:0;
    border-radius:10px;
    padding:11px 17px;
    font-weight:bold;
}

/* APP */

#app{
    min-height:100vh;
}

.topbar{
    height:68px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:bold;
    color:var(--blue);
}

.brand-mark{
    width:42px;
    height:42px;
    border-radius:10px;
    background:var(--blue);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:3px solid var(--gold);
}

.top-actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-pill{
    background:var(--blue-light);
    color:var(--blue);
    border-radius:30px;
    padding:9px 14px;
    font-weight:bold;
}

.logout{
    border:0;
    background:#eef1f5;
    padding:9px 13px;
    border-radius:9px;
}

/* LAYOUT */

.layout{
    display:flex;
    min-height:calc(100vh - 68px);
}

.sidebar{
    width:245px;
    background:#fff;
    border-right:1px solid var(--border);
    padding:20px 14px;
}

.sidebar button{
    width:100%;
    border:0;
    background:transparent;
    text-align:left;
    padding:13px;
    border-radius:9px;
    margin-bottom:5px;
    color:#344054;
}

.sidebar button:hover,
.sidebar button.active{
    background:var(--blue-light);
    color:var(--blue);
    font-weight:bold;
}

.main{
    flex:1;
    padding:28px;
    max-width:1500px;
}

.page-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:25px;
}

.page-title h2{
    margin:0;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    padding:22px;
    box-shadow:0 3px 10px rgba(0,0,0,.025);
    margin-bottom:20px;
}

.empty{
    text-align:center;
    padding:65px 25px;
}

.empty-icon{
    font-size:45px;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.stat{
    background:white;
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.stat small{
    color:var(--gray);
}

.stat strong{
    display:block;
    font-size:30px;
    margin-top:7px;
    color:var(--blue);
}

/* ELECTION */

.election-header{
    display:flex;
    gap:20px;
    align-items:center;
}

.cover{
    width:130px;
    height:90px;
    border-radius:12px;
    object-fit:cover;
    background:#edf2f7;
}

.status{
    display:inline-block;
    border-radius:20px;
    padding:6px 11px;
    font-size:12px;
    font-weight:bold;
}

.status.draft{
    background:#fff3cd;
    color:#886b00;
}

.status.active{
    background:#dff5e7;
    color:#087c35;
}

.status.paused{
    background:#e9edf2;
    color:#526170;
}

.status.finished{
    background:#e7e7e7;
    color:#555;
}

/* PARTY FORM */

.party-editor{
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:15px;
}

.party-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.party-name{
    font-weight:bold;
    color:var(--blue);
    font-size:18px;
}

.upload-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.preview{
    margin-top:10px;
    width:100%;
    height:150px;
    object-fit:contain;
    border:1px dashed #cbd5e1;
    border-radius:10px;
    background:#f8fafc;
}

.preview.logo{
    height:110px;
}

/* BALLOT */

.ballot-wrapper{
    background:#eef3f8;
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    overflow:auto;
}

.ballot{
    position:relative;
    min-width:760px;
    width:100%;
    height:650px;
    background:white;
    border:5px solid var(--blue);
    border-radius:10px;
    overflow:hidden;
}

.ballot-title{
    position:absolute;
    left:20px;
    top:15px;
    font-weight:bold;
    color:var(--blue);
    font-size:18px;
}

.ballot-subtitle{
    position:absolute;
    left:20px;
    top:42px;
    color:#667085;
    font-size:13px;
}

.ballot-card{
    position:absolute;
    width:210px;
    min-height:245px;
    background:white;
    border:2px solid #d7e0ea;
    border-radius:14px;
    padding:13px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    user-select:none;
}

.ballot-card.selected{
    border:3px solid var(--gold);
    box-shadow:0 0 0 4px rgba(217,169,40,.18);
}

.ballot-card .party-logo{
    width:50px;
    height:50px;
    object-fit:contain;
    display:block;
    margin:auto;
}

.ballot-card .candidate-photo{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:50%;
    display:block;
    margin:9px auto;
    border:3px solid #e4eaf0;
}

.ballot-card h4{
    margin:5px 0;
    text-align:center;
    color:var(--blue);
}

.ballot-card .candidate-desc{
    font-size:11px;
    color:#667085;
    text-align:center;
    line-height:1.35;
    max-height:58px;
    overflow:hidden;
}

.ballot-card .select-ballot{
    display:block;
    margin:10px auto 0;
    background:var(--blue);
    color:white;
    border:0;
    padding:7px 12px;
    border-radius:8px;
    font-size:12px;
}

/* MANAGEMENT DRAG */

.drag-card{
    cursor:grab;
}

.drag-card:active{
    cursor:grabbing;
}

.editor-ballot .ballot-card{
    cursor:move;
}

.position-help{
    background:#f0f7ff;
    color:#15538b;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
}

/* RECEIPT */

.receipt{
    max-width:650px;
    margin:auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
    border:1px solid var(--border);
}

.receipt-header{
    background:linear-gradient(135deg,var(--blue),#0a73ca);
    color:white;
    padding:22px;
    border-bottom:5px solid var(--gold);
}

.receipt-body{
    padding:24px;
}

.receipt-number{
    font-size:30px;
    font-weight:bold;
    color:var(--blue);
}

/* MOBILE */

@media(max-width:800px){

    .topbar{
        padding:0 14px;
    }

    .brand-text{
        display:none;
    }

    .layout{
        display:block;
    }

    .sidebar{
        width:100%;
        display:flex;
        overflow-x:auto;
        border-right:0;
        border-bottom:1px solid var(--border);
        padding:8px;
    }

    .sidebar button{
        min-width:max-content;
        margin:0 4px;
    }

    .main{
        padding:17px;
    }

    .page-title{
        align-items:flex-start;
        flex-direction:column;
    }

    .upload-grid{
        grid-template-columns:1fr;
    }

    .election-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .ballot{
        min-width:0;
        width:100%;
        height:950px;
    }

    .ballot-card{
        width:42%;
    }
}

@media(max-width:520px){

    .top-actions .user-pill{
        display:none;
    }

    .topbar{
        height:60px;
    }

    .main{
        padding:12px;
    }

    .card{
        padding:16px;
    }

    .ballot{
        height:1250px;
    }

    .ballot-card{
        width:80%;
        left:10%!important;
    }

    .ballot-card:nth-of-type(1){
        top:90px!important;
    }

    .ballot-card:nth-of-type(2){
        top:330px!important;
    }

    .ballot-card:nth-of-type(3){
        top:570px!important;
    }

    .ballot-card:nth-of-type(4){
        top:810px!important;
    }

    .ballot-card:nth-of-type(5){
        top:1050px!important;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage">

    <div class="login-box">

        <div class="logo-cfe">CFE</div>

        <h1>Consejo Familiar Electoral</h1>

        <p>Portal de participación familiar</p>

        <div class="form-group">
            <label>Usuario</label>
            <input id="loginUser" autocomplete="username" placeholder="Ingrese su usuario">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Ingrese su contraseña">
        </div>

        <button class="primary" style="width:100%" onclick="login()">
            Ingresar
        </button>

        <p id="loginError" style="color:#c93636;font-weight:bold;"></p>

    </div>

</section>


<!-- APP -->
<section id="app" class="hidden">

    <header class="topbar">

        <div class="brand">
            <div class="brand-mark">CFE</div>
            <span class="brand-text">
                Consejo Familiar Electoral
            </span>
        </div>

        <div class="top-actions">
            <span class="user-pill" id="currentUser"></span>
            <button class="logout" onclick="logout()">Salir</button>
        </div>

    </header>

    <div class="layout">

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main" id="mainContent"></main>

    </div>

</section>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const USERS = {

    VOriana:{
        password:"VO1",
        name:"Oriana",
        role:"voter"
    },

    VLeonel:{
        password:"VL1",
        name:"Leonel",
        role:"voter"
    },

    VZoraida:{
        password:"VZ1",
        name:"Zoraida",
        role:"voter"
    },

    VArianny:{
        password:"VA1",
        name:"Arianny",
        role:"voter"
    },

    VEfren:{
        password:"VE1",
        name:"Efrén",
        role:"voter"
    },

    VPablo:{
        password:"VP1",
        name:"Pablo",
        role:"voter"
    },

    Gestión:{
        password:"G34",
        name:"Gestión",
        role:"admin"
    }
};


const PARTIES = [

    {
        id:"enmienda",
        name:"Enmienda Sí"
    },

    {
        id:"contrario",
        name:"Partido Contrario"
    },

    {
        id:"partidoH",
        name:"Partido H"
    },

    {
        id:"cambio",
        name:"Un Cambio Significativo"
    },

    {
        id:"convivir",
        name:"Convivir"
    }

];


/* =========================================================
   STORAGE
========================================================= */

function getData(){

    const data = localStorage.getItem("CFE_DATA");

    if(data){
        return JSON.parse(data);
    }

    return {
        elections:[],
        receipts:[],
        receiptCounter:0
    };
}


function saveData(data){

    localStorage.setItem(
        "CFE_DATA",
        JSON.stringify(data)
    );
}


/* =========================================================
   SESIÓN
========================================================= */

let currentUser = null;
let currentView = "home";
let editingElectionId = null;


function login(){

    const user =
        document.getElementById("loginUser").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const account = USERS[user];

    if(!account || account.password !== password){

        document.getElementById("loginError").textContent =
            "Usuario o contraseña incorrectos.";

        return;
    }

    currentUser = {
        username:user,
        ...account
    };

    document.getElementById("loginPage")
        .classList.add("hidden");

    document.getElementById("app")
        .classList.remove("hidden");

    document.getElementById("currentUser")
        .textContent = currentUser.name;

    buildSidebar();

    render();

}


function logout(){

    currentUser = null;

    document.getElementById("app")
        .classList.add("hidden");

    document.getElementById("loginPage")
        .classList.remove("hidden");

}


/* =========================================================
   SIDEBAR
========================================================= */

function buildSidebar(){

    const sidebar =
        document.getElementById("sidebar");

    if(currentUser.role === "admin"){

        sidebar.innerHTML = `

            <button onclick="go('home')">
                🏠 Inicio
            </button>

            <button onclick="go('elections')">
                🗳️ Elecciones
            </button>

            <button onclick="go('create')">
                ＋ Nueva elección
            </button>

            <button onclick="go('results')">
                📊 Resultados
            </button>

            <button onclick="go('receipts')">
                🧾 Comprobantes
            </button>

            <button onclick="go('voters')">
                👥 Votantes
            </button>

        `;

    }else{

        sidebar.innerHTML = `

            <button onclick="go('home')">
                🏠 Inicio
            </button>

            <button onclick="go('vote')">
                🗳️ Elección
            </button>

            <button onclick="go('myreceipt')">
                🧾 Mi comprobante
            </button>

        `;
    }
}


function go(view){

    currentView = view;

    render();
}


/* =========================================================
   RENDER PRINCIPAL
========================================================= */

function render(){

    const main =
        document.getElementById("mainContent");

    if(currentUser.role === "admin"){

        renderAdmin(main);

    }else{

        renderVoter(main);

    }

}


/* =========================================================
   ADMIN
========================================================= */

function renderAdmin(main){

    if(currentView === "home"){

        const data = getData();

        const active =
            data.elections.find(e => e.status === "active");

        main.innerHTML = `

            <div class="page-title">

                <div>
                    <h2>Inicio</h2>
                    <p style="color:#64748b">
                        Panel de Gestión del CFE
                    </p>
                </div>

                <button class="primary"
                    onclick="go('create')">
                    + Nueva elección
                </button>

            </div>

            <div class="grid">

                <div class="stat">
                    <small>Elecciones creadas</small>
                    <strong>${data.elections.length}</strong>
                </div>

                <div class="stat">
                    <small>Elección activa</small>
                    <strong>${active ? "1" : "0"}</strong>
                </div>

                <div class="stat">
                    <small>Votos emitidos</small>
                    <strong>${data.receipts.length}</strong>
                </div>

                <div class="stat">
                    <small>Comprobantes</small>
                    <strong>${data.receipts.length}</strong>
                </div>

            </div>

            ${
                active
                ?
                `
                <div class="card">

                    <h3>Elección activa</h3>

                    <h2>${escapeHTML(active.name)}</h2>

                    <p>${escapeHTML(active.description || "")}</p>

                    <span class="status active">
                        ACTIVA
                    </span>

                    <br><br>

                    <button class="primary"
                        onclick="editElection('${active.id}')">
                        Gestionar elección
                    </button>

                </div>
                `
                :
                `
                <div class="card empty">

                    <div class="empty-icon">🗳️</div>

                    <h2>No hay elecciones activas</h2>

                    <p>
                        Cree una elección para comenzar.
                    </p>

                    <button class="primary"
                        onclick="go('create')">
                        Crear elección
                    </button>

                </div>
                `
            }

        `;

        return;
    }


    if(currentView === "elections"){

        renderElectionList(main);

        return;
    }


    if(currentView === "create"){

        renderElectionForm(main);

        return;
    }


    if(currentView === "results"){

        renderResults(main);

        return;
    }


    if(currentView === "receipts"){

        renderReceipts(main);

        return;
    }


    if(currentView === "voters"){

        renderVoters(main);

        return;
    }

}


/* =========================================================
   LISTA DE ELECCIONES
========================================================= */

function renderElectionList(main){

    const data = getData();

    if(data.elections.length === 0){

        main.innerHTML = `

            <div class="page-title">
                <h2>Elecciones</h2>
                <button class="primary"
                    onclick="go('create')">
                    + Nueva elección
                </button>
            </div>

            <div class="card empty">

                <div class="empty-icon">🗳️</div>

                <h2>No hay elecciones creadas</h2>

                <p>
                    Gestión todavía no ha creado ninguna elección.
                </p>

            </div>

        `;

        return;
    }


    main.innerHTML = `

        <div class="page-title">

            <h2>Elecciones</h2>

            <button class="primary"
                onclick="go('create')">
                + Nueva elección
            </button>

        </div>

        ${data.elections.map(e => `

            <div class="card">

                <div class="election-header">

                    ${
                        e.coverImage
                        ?
                        `<img class="cover"
                            src="${e.coverImage}">`
                        :
                        `<div class="cover"></div>`
                    }

                    <div style="flex:1">

                        <h2>${escapeHTML(e.name)}</h2>

                        <p>
                            ${escapeHTML(e.description || "Sin descripción")}
                        </p>

                        <span class="status ${e.status}">
                            ${statusName(e.status)}
                        </span>

                    </div>

                    <div>

                        <button class="primary"
                            onclick="editElection('${e.id}')">
                            Gestionar
                        </button>

                    </div>

                </div>

            </div>

        `).join("")}

    `;

}


/* =========================================================
   CREAR / EDITAR ELECCIÓN
========================================================= */

function renderElectionForm(main){

    let election = null;

    if(editingElectionId){

        election =
            getData().elections
            .find(e => e.id === editingElectionId);

    }


    const parties =
        election
        ?
        election.parties
        :
        PARTIES.map((p,index) => ({
            ...p,
            candidateName:"",
            candidateDescription:"",
            logo:"",
            candidatePhoto:"",
            x:[20,250,480,250,20][index],
            y:[100,100,100,350,350][index]
        }));


    main.innerHTML = `

        <div class="page-title">

            <div>
                <h2>
                    ${election ? "Editar elección" : "Nueva elección"}
                </h2>

                <p style="color:#64748b">
                    Gestión configura todos los elementos.
                </p>
            </div>

            <button class="secondary"
                onclick="go('elections')">
                Cancelar
            </button>

        </div>


        <div class="card">

            <h3>Información de la elección</h3>

            <div class="form-group">
                <label>Nombre de la elección</label>
                <input id="electionName"
                    value="${escapeAttr(election?.name || "")}"
                    placeholder="Ej. Elección familiar 2026">
            </div>

            <div class="form-group">
                <label>Tema de la elección</label>
                <input id="electionTheme"
                    value="${escapeAttr(election?.theme || "")}"
                    placeholder="Gestión decide el tema">
            </div>

/* =========================================================
   ARCHIVOS / IMÁGENES
========================================================= */

function previewFile(input, previewId){

    const file = input.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(){

        const img =
            document.getElementById(previewId);

        img.src = reader.result;

        img.classList.remove("hidden");

    };

    reader.readAsDataURL(file);

}


function fileToDataURL(input){

    return new Promise(resolve => {

        if(!input || !input.files[0]){

            resolve(null);

            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            () => resolve(reader.result);

        reader.readAsDataURL(input.files[0]);

    });

}


/* =========================================================
   DRAG & DROP LIBRE
========================================================= */

let dragging = null;
let dragOffsetX = 0;
let dragOffsetY = 0;


function setupDragEvents(){

    document.querySelectorAll(".drag-card")
        .forEach(card => {

            card.addEventListener(
                "mousedown",
                dragStart
            );

        });

}


function dragStart(e){

    if(e.target.tagName === "BUTTON") return;

    const card =
        e.currentTarget || e.target.closest(".drag-card");

    if(!card) return;

    dragging = card;

    const rect =
        card.getBoundingClientRect();

    dragOffsetX =
        e.clientX - rect.left;

    dragOffsetY =
        e.clientY - rect.top;

    document.addEventListener(
        "mousemove",
        dragMove
    );

    document.addEventListener(
        "mouseup",
        dragEnd
    );

}


function dragMove(e){

    if(!dragging) return;

    const ballot =
        document.getElementById("editorBallot");

    const rect =
        ballot.getBoundingClientRect();

    let x =
        e.clientX -
        rect.left -
        dragOffsetX;

    let y =
        e.clientY -
        rect.top -
        dragOffsetY;

    x = Math.max(
        0,
        Math.min(
            x,
            rect.width - dragging.offsetWidth
        )
    );

    y = Math.max(
        65,
        Math.min(
            y,
            rect.height - dragging.offsetHeight
        )
    );

    dragging.style.left = x + "px";
    dragging.style.top = y + "px";

}


function dragEnd(){

    dragging = null;

    document.removeEventListener(
        "mousemove",
        dragMove
    );

    document.removeEventListener(
        "mouseup",
        dragEnd
    );

}


/* =========================================================
   TOUCH
========================================================= */

let touchCard = null;


function touchStart(e){

    touchCard =
        e.currentTarget;

    const touch =
        e.touches[0];

    const rect =
        touchCard.getBoundingClientRect();

    dragOffsetX =
        touch.clientX - rect.left;

    dragOffsetY =
        touch.clientY - rect.top;

}


function touchMove(e){

    if(!touchCard) return;

    e.preventDefault();

    const touch =
        e.touches[0];

    const ballot =
        document.getElementById("editorBallot");

    const rect =
        ballot.getBoundingClientRect();

    let x =
        touch.clientX -
        rect.left -
        dragOffsetX;

    let y =
        touch.clientY -
        rect.top -
        dragOffsetY;

    x = Math.max(
        0,
        Math.min(
            x,
            rect.width - touchCard.offsetWidth
        )
    );

    y = Math.max(
        65,
        Math.min(
            y,
            rect.height - touchCard.offsetHeight
        )
    );

    touchCard.style.left =
        x + "px";

    touchCard.style.top =
        y + "px";

}


function touchEnd(){

    touchCard = null;

}


/* =========================================================
   GUARDAR ELECCIÓN
========================================================= */

async function saveElection(forceStatus=null){

    const name =
        document.getElementById("electionName").value.trim();

    if(!name){

        alert("Debe colocar el nombre de la elección.");

        return;
    }


    const data = getData();

    let election = null;

    if(editingElectionId){

        election =
            data.elections.find(
                e => e.id === editingElectionId
            );

    }


    const parties = [];


    for(let i=0;i<PARTIES.length;i++){

        const oldParty =
            election?.parties?.[i] || {};


        const logo =
            await fileToDataURL(
                document.getElementById("logo_"+i)
            ) || oldParty.logo || "";


        const photo =
            await fileToDataURL(
                document.getElementById("photo_"+i)
            ) || oldParty.candidatePhoto || "";


        const card =
            document.getElementById("drag_"+i);


        parties.push({

            id:PARTIES[i].id,

            name:PARTIES[i].name,

            candidateName:
                document
                .getElementById(
                    "candidateName_"+i
                ).value.trim(),

            candidateDescription:
                document
                .getElementById(
                    "candidateDescription_"+i
                ).value.trim(),

            logo:logo,

            candidatePhoto:photo,

            x:parseFloat(card.style.left) || 0,

            y:parseFloat(card.style.top) || 65,

            votes:oldParty.votes || 0

        });

    }


    if(!election){

        election = {

            id:
                "ELEC-" +
                Date.now(),

            name:name,

            theme:
                document
                .getElementById("electionTheme")
                .value.trim(),

            description:
                document
                .getElementById("electionDescription")
                .value.trim(),

            coverImage:
                await fileToDataURL(
                    document.getElementById("coverImage")
                ) || "",

            startDate:
                document.getElementById("startDate").value,

            endDate:
                document.getElementById("endDate").value,

            status:
                forceStatus || "draft",

            parties:parties,

            votedUsers:[],

            createdAt:
                new Date().toISOString()

        };

        data.elections.push(election);

    }else{

        election.name = name;

        election.theme =
            document.getElementById("electionTheme").value.trim();

        election.description =
            document.getElementById("electionDescription").value.trim();

        election.coverImage =
            await fileToDataURL(
                document.getElementById("coverImage")
            ) || election.coverImage || "";

        election.startDate =
            document.getElementById("startDate").value;

        election.endDate =
            document.getElementById("endDate").value;

        election.parties =
            parties;

        if(forceStatus){
            election.status = forceStatus;
        }

    }


    saveData(data);

    editingElectionId = null;

    alert(
        forceStatus === "active"
        ?
        "La elección fue publicada y activada."
        :
        "Elección guardada correctamente."
    );

    go("elections");

}

function selectParty(id){

    selectedPartyId = id;

    document.querySelectorAll(".ballot-card")
        .forEach(card =>
            card.classList.remove("selected")
        );

    const party =
        getData()
        .elections
        .find(e => e.status === "active")
        .parties
        .find(p => p.id === id);


    const card =
        document.getElementById(
            "voteCard_" +
            getData()
            .elections
            .find(e => e.status === "active")
            .parties
            .findIndex(p => p.id === id)
        );


    if(card){
        card.classList.add("selected");
    }


    document.getElementById(
        "voteConfirmation"
    ).style.display = "block";


    document.getElementById(
        "selectedPartyText"
    ).textContent =
        "Has seleccionado: " +
        party.name +
        ". Revisa tu selección antes de confirmar.";

    if(!selectedPartyId){

        alert("Seleccione una opción.");

        return;

    const data = getData();

    const election =
        data.elections.find(
            e => e.status === "active"
        );


    if(!election){

        alert("La elección ya no está activa.");

        return;
    }


    if(
        election.votedUsers
        .includes(currentUser.username)
    ){

        alert("Este usuario ya votó.");

        return;
    }


    const party =
        election.parties.find(
            p => p.id === selectedPartyId
        );


    if(!party) return;


    party.votes =
        (party.votes || 0) + 1;


    election.votedUsers.push(
        currentUser.username
    );


    data.receiptCounter++;


    const receipt = {

        number:data.receiptCounter,

        id:
            "CFE-" +
            Date.now(),

        electionId:election.id,

        electionName:election.name,

        voterUsername:
            currentUser.username,

        voterName:
            currentUser.name,

        partyId:
            party.id,

        partyName:
            party.name,

        candidateName:
            party.candidateName,

        date:
            new Date().toISOString()

    };


    data.receipts.push(receipt);

    saveData(data);


    alert(
        "Tu voto fue registrado correctamente."
    );


    go("myreceipt");

}


/* =========================================================
   MI COMPROBANTE
========================================================= */

function renderMyReceipt(main){

    const data = getData();

    const receipt =
        data.receipts
        .slice()
        .reverse()
        .find(
            r =>
                r.voterUsername ===
                currentUser.username
        );


    if(!receipt){

        main.innerHTML = `

            <div class="card empty">

                <div class="empty-icon">🧾</div>

                <h2>No tienes comprobantes</h2>

                <p>
                    Todavía no has emitido un voto.
                </p>

            </div>

        `;

        return;
    }


    main.innerHTML = `

        <div class="page-title">

            <h2>Mi comprobante</h2>

        </div>


        <div class="receipt">

            <div class="receipt-header">

                <strong>
                    CONSEJO FAMILIAR ELECTORAL
                </strong>

                <h2>
                    Comprobante de votación
                </h2>

            </div>


            <div class="receipt-body">

                <p>
                    Número de comprobante
                </p>

                <div class="receipt-number">
                    #${String(
                        receipt.number
                    ).padStart(6,"0")}
                </div>

                <hr>

                <p>
                    <strong>Elección:</strong><br>
                    ${escapeHTML(receipt.electionName)}
                </p>

                <p>
                    <strong>Votante:</strong><br>
                    ${escapeHTML(receipt.voterName)}
                </p>

                <p>
                    <strong>Partido seleccionado:</strong><br>
                    ${escapeHTML(receipt.partyName)}
                </p>

                <p>
                    <strong>Candidato:</strong><br>
                    ${escapeHTML(receipt.candidateName || "—")}
                </p>

                <p>
                    <strong>Fecha y hora:</strong><br>
                    ${formatDate(receipt.date)}
                </p>

                <hr>

                <p style="
                    color:#64748b;
                    font-size:13px;
                ">
                    Este comprobante confirma que la participación fue registrada por el sistema CFE.
                </p>

            </div>

        </div>

    `;

}


/* =========================================================
   FUNCIONES AUXILIARES
========================================================= */

function statusName(status){

    const names = {

        draft:"BORRADOR",

        active:"ACTIVA",

        paused:"PAUSADA",

        finished:"FINALIZADA"

    };

    return names[status] || status;

}


function formatDate(date){

    return new Date(date)
        .toLocaleString(
            "es-VE",
            {
                dateStyle:"short",
                timeStyle:"short"
            }
        );

}


function escapeHTML(value){

    if(value === null || value === undefined)
        return "";

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttr(value){

    return escapeHTML(value || "");

}


/* =========================================================
   ARRANQUE
========================================================= */

render();

</script>
