<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CFE | Consejo Familiar Electoral</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fa;
    color:#172033;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#064b91,#0875ca);
}

.login-card{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.logo{
    width:75px;
    height:75px;
    margin:0 auto 18px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0756a5;
    color:white;
    font-size:25px;
    font-weight:bold;
    border-bottom:5px solid #d5a62a;
}

.login-card h1{
    text-align:center;
    margin:0;
    color:#063d78;
    font-size:25px;
}

.login-card .subtitle{
    text-align:center;
    color:#68758a;
    margin:8px 0 30px;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.field input{
    width:100%;
    padding:14px;
    border:1px solid #d9e0e9;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.field input:focus{
    border-color:#0756a5;
}

.login-button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:14px;
    background:#0756a5;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-button:hover{
    background:#063d78;
}

.error{
    display:none;
    background:#ffeaea;
    color:#b32020;
    padding:12px;
    border-radius:9px;
    margin-bottom:15px;
    font-size:14px;
}

/* =========================
   APP
========================= */

#app{
    display:none;
    min-height:100vh;
}

.topbar{
    height:68px;
    background:white;
    border-bottom:1px solid #dfe5ed;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-logo{
    width:42px;
    height:42px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0756a5;
    color:white;
    font-weight:bold;
    border-bottom:3px solid #d5a62a;
}

.brand-name{
    color:#063d78;
    font-weight:bold;
}

.user-section{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-pill{
    background:#eaf3ff;
    color:#0756a5;
    padding:8px 13px;
    border-radius:20px;
    font-size:14px;
    font-weight:bold;
}

.logout{
    border:0;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
    background:#edf0f4;
}

/* =========================
   LAYOUT
========================= */

.layout{
    display:flex;
    min-height:calc(100vh - 68px);
}

.sidebar{
    width:235px;
    background:#063f7d;
    padding:18px 12px;
    flex-shrink:0;
}

.sidebar-title{
    color:white;
    opacity:.55;
    font-size:11px;
    text-transform:uppercase;
    padding:12px;
}

.menu-button{
    width:100%;
    border:0;
    background:transparent;
    color:white;
    text-align:left;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    margin-bottom:4px;
}

.menu-button:hover,
.menu-button.active{
    background:rgba(255,255,255,.15);
}

.content{
    flex:1;
    padding:30px;
    max-width:1450px;
    width:100%;
    margin:auto;
}

/* =========================
   PAGE
========================= */

.page-header{
    margin-bottom:25px;
}

.page-header h2{
    margin:0;
    color:#063d78;
    font-size:28px;
}

.page-header p{
    color:#68758a;
    margin-top:7px;
}

.panel{
    background:white;
    border:1px solid #dfe5ed;
    border-radius:15px;
    padding:24px;
    margin-bottom:20px;
    box-shadow:0 6px 20px rgba(0,40,80,.05);
}

.panel h3{
    margin:0 0 15px;
    color:#063d78;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:55px 20px;
}

.empty-icon{
    font-size:48px;
    margin-bottom:15px;
}

.empty h3{
    margin-bottom:8px;
}

.empty p{
    color:#68758a;
}

/* =========================
   BUTTONS
========================= */

.btn{
    border:0;
    border-radius:9px;
    padding:11px 16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-primary{
    background:#0756a5;
    color:white;
}

.btn-success{
    background:#18864b;
    color:white;
}

.btn-warning{
    background:#d5a62a;
    color:white;
}

.btn-danger{
    background:#c62828;
    color:white;
}

.btn-light{
    background:#edf0f4;
    color:#263449;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border:1px solid #dfe5ed;
    border-radius:14px;
    padding:20px;
}

.stat-number{
    font-size:30px;
    font-weight:bold;
    color:#0756a5;
}

.stat-label{
    color:#68758a;
    margin-top:5px;
}

/* =========================
   FORMULARIOS
========================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.form-group{
    margin-bottom:15px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #d9e0e9;
    border-radius:9px;
    font-family:Arial,sans-serif;
    font-size:14px;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

/* =========================
   ELECCIONES
========================= */

.election{
    border:1px solid #dfe5ed;
    border-radius:13px;
    padding:20px;
    margin-bottom:15px;
    background:white;
}

.election-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:center;
}

.election h3{
    margin:0;
    color:#063d78;
}

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
}

.status.draft{
    background:#edf0f4;
    color:#637083;
}

.status.active{
    background:#dff5e8;
    color:#157341;
}

.status.paused{
    background:#fff1ce;
    color:#956800;
}

.status.finished{
    background:#e5edf8;
    color:#315a91;
}

/* =========================
   MOBILE
========================= */

.mobile-button{
    display:none;
    border:0;
    background:#edf2f8;
    border-radius:8px;
    padding:9px 11px;
    cursor:pointer;
}

@media(max-width:850px){

    .mobile-button{
        display:block;
    }

    .sidebar{
        display:none;
        position:fixed;
        left:0;
        top:68px;
        bottom:0;
        z-index:90;
    }

    .sidebar.open{
        display:block;
    }

    .brand-name{
        display:none;
    }

    .user-pill{
        display:none;
    }

    .content{
        padding:18px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

}

@media(max-width:550px){

    .topbar{
        padding:0 12px;
    }

    .login-card{
        padding:25px 20px;
    }

    .page-header h2{
        font-size:23px;
    }

    .election-top{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen">

    <div class="login-card">

        <div class="logo">
            CFE
        </div>

        <h1>
            Consejo Familiar Electoral
        </h1>

        <p class="subtitle">
            Sistema de gestión electoral familiar
        </p>

        <div id="loginError" class="error">
            Usuario o contraseña incorrectos.
        </div>

        <form id="loginForm">

            <div class="field">

                <label for="username">
                    Usuario
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Ingrese su usuario"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="field">

                <label for="password">
                    Contraseña
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Ingrese su contraseña"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-button"
            >
                Ingresar
            </button>

        </form>

    </div>

</div>


<!-- =====================================================
     APLICACIÓN
===================================================== -->

<div id="app">

    <header class="topbar">

        <div class="brand">

            <button
                class="mobile-button"
                type="button"
                onclick="toggleSidebar()"
            >
                ☰
            </button>

            <div class="brand-logo">
                CFE
            </div>

            <div class="brand-name">
                Consejo Familiar Electoral
            </div>

        </div>


        <div class="user-section">

            <div
                id="userPill"
                class="user-pill"
            >
            </div>

            <button
                type="button"
                class="logout"
                onclick="logout()"
            >
                Cerrar sesión
            </button>

        </div>

    </header>


    <div class="layout">


        <!-- SIDEBAR -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <div class="sidebar-title">
                Principal
            </div>

            <button
                id="menuInicio"
                class="menu-button active"
                type="button"
                onclick="navigate('inicio')"
            >
                🏠 Inicio
            </button>

            <button
                id="menuElecciones"
                class="menu-button"
                type="button"
                onclick="navigate('elecciones')"
            >
                🗳️ Elecciones
            </button>


            <div id="adminNavigation">

                <div class="sidebar-title">
                    Gestión electoral
                </div>

                <button
                    class="menu-button"
                    type="button"
                    onclick="navigate('crear')"
                >
                    ＋ Crear elección
                </button>

                <button
                    class="menu-button"
                    type="button"
                    onclick="navigate('resultados')"
                >
                    📊 Resultados
                </button>

                <button
                    class="menu-button"
                    type="button"
                    onclick="navigate('comprobantes')"
                >
                    🧾 Comprobantes
                </button>

                <button
                    class="menu-button"
                    type="button"
                    onclick="navigate('votantes')"
                >
                    👥 Votantes
                </button>

                <button
                    class="menu-button"
                    type="button"
                    onclick="navigate('historial')"
                >
                    🕘 Historial
                </button>

            </div>

        </aside>


        <!-- CONTENIDO -->

        <main
            id="content"
            class="content"
        >
        </main>


    </div>

</div>


<script>

/* =====================================================
   CFE
   SISTEMA BASE
===================================================== */


/* =====================================================
   USUARIOS
===================================================== */

const USERS = {

    VOriana: {
        password: "VO1",
        name: "Oriana",
        role: "voter"
    },

    VLeonel: {
        password: "VL1",
        name: "Leonel",
        role: "voter"
    },

    VZoraida: {
        password: "VZ1",
        name: "Zoraida",
        role: "voter"
    },

    VArianny: {
        password: "VA1",
        name: "Arianny",
        role: "voter"
    },

    VEfren: {
        password: "VE1",
        name: "Efrén",
        role: "voter"
    },

    VPablo: {
        password: "VP1",
        name: "Pablo",
        role: "voter"
    },

    "Gestión": {
        password: "G34",
        name: "Gestión",
        role: "admin"
    }

};


/* =====================================================
   PARTIDOS
===================================================== */

const PARTIES = [
    "Enmienda Sí",
    "Partido Contrario",
    "Partido H",
    "Un Cambio Significativo",
    "Convivir"
];


/* =====================================================
   DATOS
===================================================== */

const STORAGE_KEY = "CFE_ESTABLE_V1";

let currentUser = null;

let database = loadDatabase();


function loadDatabase(){

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if(!saved){

        return {
            elections: [],
            receipts: [],
            receiptNumber: 0
        };

    }

    try{

        return JSON.parse(saved);

    }catch(error){

        console.error(
            "Error leyendo datos:",
            error
        );

        return {
            elections: [],
            receipts: [],
            receiptNumber: 0
        };

    }

}


function saveDatabase(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(database)
    );

}


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener("submit", function(event){

    event.preventDefault();

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    let user = USERS[username];

    /*
       Permitir Gestión sin tilde.
    */

    if(username === "Gestion"){
        user = USERS["Gestión"];
    }


    if(
        user &&
        user.password === password
    ){

        currentUser = {

            username:
                username === "Gestion"
                ? "Gestión"
                : username,

            name:user.name,

            role:user.role

        };


        document
        .getElementById("loginScreen")
        .style.display = "none";


        document
        .getElementById("app")
        .style.display = "block";


        document
        .getElementById("userPill")
        .textContent =
            currentUser.name;


        document
        .getElementById("adminNavigation")
        .style.display =
            currentUser.role === "admin"
            ? "block"
            : "none";


        document
        .getElementById("loginError")
        .style.display = "none";


        navigate("inicio");


    }else{

        document
        .getElementById("loginError")
        .style.display = "block";

    }

});


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    currentUser = null;

    document
    .getElementById("app")
    .style.display = "none";

    document
    .getElementById("loginScreen")
    .style.display = "flex";

    document
    .getElementById("password")
    .value = "";

}


/* =====================================================
   SIDEBAR
===================================================== */

function toggleSidebar(){

    document
    .getElementById("sidebar")
    .classList.toggle("open");

}


/* =====================================================
   NAVEGACIÓN
===================================================== */

function navigate(page){

    if(!currentUser){
        return;
    }


    const content =
        document.getElementById("content");


    document
    .querySelectorAll(".menu-button")
    .forEach(function(button){

        button.classList.remove("active");

    });


    if(page === "inicio"){

        document
        .getElementById("menuInicio")
        .classList.add("active");

        renderInicio(content);

    }


    else if(page === "elecciones"){

        document
        .getElementById("menuElecciones")
        .classList.add("active");

        renderElecciones(content);

    }


    else if(page === "crear"){

        if(currentUser.role !== "admin"){
            return;
        }

        renderCrear(content);

    }


    else if(page === "resultados"){

        if(currentUser.role !== "admin"){
            return;
        }

        renderResultados(content);

    }


    else if(page === "comprobantes"){

        if(currentUser.role !== "admin"){
            return;
        }

        renderComprobantes(content);

    }


    else if(page === "votantes"){

        if(currentUser.role !== "admin"){
            return;
        }

        renderVotantes(content);

    }


    else if(page === "historial"){

        if(currentUser.role !== "admin"){
            return;
        }

        renderHistorial(content);

    }


    document
    .getElementById("sidebar")
    .classList.remove("open");

}


/* =====================================================
   INICIO
===================================================== */

function renderInicio(content){

    if(currentUser.role === "admin"){

        const totalVotes =
            database.elections.reduce(
                function(total,election){

                    return total +
                        getTotalVotes(election);

                },
                0
            );


        const active =
            database.elections.find(
                function(election){

                    return election.status === "active";

                }
            );


        content.innerHTML = `

            <div class="page-header">

                <h2>
                    Panel de Gestión
                </h2>

                <p>
                    Bienvenido al Consejo Familiar Electoral.
                </p>

            </div>


            <div class="stats">

                <div class="stat">

                    <div class="stat-number">
                        ${database.elections.length}
                    </div>

                    <div class="stat-label">
                        Elecciones creadas
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-number">
                        ${totalVotes}
                    </div>

                    <div class="stat-label">
                        Votos emitidos
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-number">
                        ${database.receipts.length}
                    </div>

                    <div class="stat-label">
                        Comprobantes
                    </div>

                </div>

            </div>


            <div class="panel">

                <h3>
                    Estado del sistema
                </h3>


                ${
                    active

                    ? `

                        <p>
                            Elección activa:
                            <strong>
                                ${escapeHTML(active.name)}
                            </strong>
                        </p>

                        <br>

                        <button
                            class="btn btn-primary"
                            onclick="openElection('${active.id}')"
                        >
                            Administrar elección
                        </button>

                    `

                    : `

                        <div class="empty">

                            <div class="empty-icon">
                                🗳️
                            </div>

                            <h3>
                                No hay elecciones activas
                            </h3>

                            <p>
                                El sistema está listo para que Gestión cree la primera elección.
                            </p>

                            <br>

                            <button
                                class="btn btn-primary"
                                onclick="navigate('crear')"
                            >
                                ＋ Crear elección
                            </button>

                        </div>

                    `
                }

            </div>

        `;

        return;

    }


    /* =================
       VOTANTE
    ================= */

    const active =
        database.elections.find(
            function(election){

                return election.status === "active";

            }
        );


    if(!active){

        content.innerHTML = `

            <div class="page-header">

                <h2>
                    Inicio
                </h2>

                <p>
                    Portal del votante.
                </p>

            </div>


            <div class="panel">

                <div class="empty">

                    <div class="empty-icon">
                        🗳️
                    </div>

                    <h3>
                        No hay elecciones disponibles
                    </h3>

                    <p>
                        Actualmente no existe una elección activa.
                    </p>

                </div>

            </div>

        `;

        return;

    }


    const voted =
        active.votedUsers &&
        active.votedUsers.includes(
            currentUser.username
        );


    content.innerHTML = `

        <div class="page-header">

            <h2>
                Elección disponible
            </h2>

            <p>
                ${escapeHTML(active.name)}
            </p>

        </div>


        <div class="panel">

            <h3>
                ${escapeHTML(active.name)}
            </h3>

            <p>
                ${escapeHTML(active.description || "")}
            </p>

            <br>

            ${
                voted

                ? `

                    <strong>
                        ✓ Usted ya emitió su voto.
                    </strong>

                `

                : `

                    <button
                        class="btn btn-primary"
                        onclick="openElection('${active.id}')"
                    >
                        Ver tarjetón electoral
                    </button>

                `
            }

        </div>

    `;

}


/* =====================================================
   ELECCIONES
===================================================== */

function renderElecciones(content){

    if(currentUser.role !== "admin"){

        renderInicio(content);

        return;

    }


    if(database.elections.length === 0){

        content.innerHTML = `

            <div class="page-header">

                <h2>
                    Elecciones
                </h2>

                <p>
                    Administración electoral.
                </p>

            </div>


            <div class="panel">

                <div class="empty">

                    <div class="empty-icon">
                        🗳️
                    </div>

                    <h3>
                        No hay elecciones creadas
                    </h3>

                    <p>
                        El sistema comienza completamente vacío.
                    </p>

                    <br>

                    <button
                        class="btn btn-primary"
                        onclick="navigate('crear')"
                    >
                        ＋ Crear primera elección
                    </button>

                </div>

            </div>

        `;

        return;

    }


    content.innerHTML = `

        <div class="page-header">

            <h2>
                Elecciones
            </h2>

            <p>
                Procesos electorales del CFE.
            </p>

        </div>


        ${database.elections.map(function(election){

            return `

                <div class="election">

                    <div class="election-top">

                        <div>

                            <h3>
                                ${escapeHTML(election.name)}
                            </h3>

                            <p style="color:#68758a;margin-top:7px">
                                ${getTotalVotes(election)} votos
                            </p>

                        </div>

                        ${statusHTML(election.status)}

                    </div>


                    <br>


                    <button
                        class="btn btn-primary"
                        onclick="openElection('${election.id}')"
                    >
                        Administrar
                    </button>

                </div>

            `;

        }).join("")}

    `;

}


/* =====================================================
   CREAR ELECCIÓN
===================================================== */

function renderCrear(content){

function createElection(event){

    event.preventDefault();


    const name =
        document
        .getElementById("newElectionName")
        .value
        .trim();


    if(!name){

        alert(
            "Debe colocar un nombre."
        );

        return;

    }


    const parties =
        PARTIES.map(function(party,index){

            return {

                id:"party-" + index,

                name:party,

                candidate:
                    document
                    .getElementById(
                        "candidate_" + index
                    )
                    .value
                    .trim(),

                description:
                    document
                    .getElementById(
                        "description_" + index
                    )
                    .value
                    .trim(),

                votes:0

            };

        });


    const election = {

        id:
            "election-" +
            Date.now(),

        name:name,

        theme:
            document
            .getElementById("newElectionTheme")
            .value
            .trim(),

        description:
            document
            .getElementById("newElectionDescription")
            .value
            .trim(),

        start:
            document
            .getElementById("newElectionStart")
            .value,

        end:
            document
            .getElementById("newElectionEnd")
            .value,

        status:"draft",

        parties:parties,

        votedUsers:[],

        createdAt:
            new Date().toISOString()

    };


    database.elections.push(
        election
    );


    saveDatabase();


    alert(
        "Elección creada correctamente como Borrador."
    );


    navigate("elecciones");

}

/* =====================================================
   CAMBIAR ESTADO
===================================================== */

function changeStatus(id,status){

    const election =
        database.elections.find(
            function(item){

                return item.id === id;

            }
        );


    if(!election){
        return;
    }


    if(status === "active"){

        const another =
            database.elections.find(
                function(item){

                    return (
                        item.id !== id &&
                        item.status === "active"
                    );

                }
            );


        if(another){

            alert(
                "Ya existe otra elección activa."
            );

            return;

        }

    }


    election.status = status;

    saveDatabase();

    renderAdminElection(election);

}


/* =====================================================
   ELIMINAR
===================================================== */

function deleteElection(id){

    const election =
        database.elections.find(
            function(item){

                return item.id === id;

            }
        );


    if(!election){
        return;
    }


    const confirmation =
        confirm(
            "¿Desea eliminar esta elección?"
        );


    if(!confirmation){
        return;
    }


    database.elections =
        database.elections.filter(
            function(item){

                return item.id !== id;

            }
        );


    saveDatabase();

    navigate("elecciones");

}

/* =====================================================
   VOTAR
===================================================== */

function submitVote(electionId){

    const election =
        database.elections.find(
            function(item){

                return item.id === electionId;

            }
        );


    if(!election){
        return;
    }


    const selected =
        document.querySelector(
            'input[name="vote"]:checked'
        );


    if(!selected){

        alert(
            "Debe seleccionar una opción."
        );

        return;

    }


    const party =
        election.parties.find(
            function(item){

                return item.id === selected.value;

            }
        );


    if(!party){
        return;
    }


    if(
        election.votedUsers.includes(
            currentUser.username
        )
    ){

        alert(
            "Usted ya votó."
        );

        return;

    }


    const confirmation =
        confirm(
            "¿Confirma su voto por " +
            party.name +
            "?"
        );


    if(!confirmation){
        return;
    }


    party.votes++;

    election.votedUsers.push(
        currentUser.username
    );


    database.receiptNumber++;


    const number =
        String(
            database.receiptNumber
        ).padStart(6,"0");


    const receipt = {

        id:
            "receipt-" +
            Date.now(),

        number:number,

        electionId:
            election.id,

        electionName:
            election.name,

        voter:
            currentUser.name,

        voterUsername:
            currentUser.username,

        party:
            party.name,

        candidate:
            party.candidate,

        date:
            new Date().toISOString()

    };


    database.receipts.push(
        receipt
    );


    saveDatabase();


    showReceipt(receipt);

}

/* =====================================================
   FUNCIONES AUXILIARES
===================================================== */

function getTotalVotes(election){

    return election.parties.reduce(
        function(total,party){

            return total +
                Number(party.votes || 0);

        },
        0
    );

}


function getWinner(election){

    if(getTotalVotes(election) === 0){

        return "Sin votos";

    }


    let winner =
        election.parties[0];


    election.parties.forEach(
        function(party){

            if(
                party.votes >
                winner.votes
            ){

                winner = party;

            }

        }
    );


    return winner.name +
        (
            winner.candidate
            ? " — " + winner.candidate
            : ""
        );

}


function statusHTML(status){

    const labels = {

        draft:"Borrador",

        active:"Activa",

        paused:"Pausada",

        finished:"Finalizada"

    };


    return `

        <span class="status ${status}">
            ${labels[status] || status}
        </span>

    `;

}


function formatDate(date){

    if(!date){
        return "—";
    }


    try{

        return new Date(date)
        .toLocaleString(
            "es-VE",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return date;

    }

}


function escapeHTML(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
