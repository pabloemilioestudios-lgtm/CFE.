<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CFE | Consejo Familiar Electoral</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --blue:#0b1f3a;
    --blue2:#12345b;
    --gold:#c9a44c;
    --gold2:#e0bd68;
    --white:#ffffff;
    --bg:#f4f6f9;
    --text:#172033;
    --muted:#697386;
    --border:#e2e6ec;
    --success:#16835b;
    --danger:#c43c3c;
    --shadow:0 12px 35px rgba(10,30,60,.10);
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* LOGIN */

.login-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    background:
        radial-gradient(circle at top right,rgba(201,164,76,.18),transparent 30%),
        linear-gradient(135deg,#07172c,#102d50);
}

.login-card{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:26px;
    padding:34px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.logo{
    width:72px;
    height:72px;
    margin:0 auto 18px;
    border-radius:22px;
    background:var(--blue);
    color:var(--gold2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
    border:2px solid var(--gold);
}

.login-card h1{
    text-align:center;
    color:var(--blue);
    font-size:27px;
}

.login-card .subtitle{
    text-align:center;
    color:var(--muted);
    margin-top:7px;
    margin-bottom:28px;
}

.field{
    margin-bottom:16px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    border:1px solid var(--border);
    border-radius:13px;
    padding:13px 14px;
    outline:none;
    background:#fff;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,164,76,.12);
}

.primary-btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    background:var(--blue);
    color:white;
    font-weight:800;
    transition:.2s;
}

.primary-btn:hover{
    background:var(--blue2);
    transform:translateY(-1px);
}

.gold-btn{
    border:0;
    border-radius:12px;
    padding:11px 16px;
    background:var(--gold);
    color:var(--blue);
    font-weight:800;
}

.secondary-btn{
    border:1px solid var(--border);
    background:white;
    color:var(--text);
    border-radius:12px;
    padding:11px 16px;
    font-weight:700;
}

.danger-btn{
    border:0;
    background:#fff0f0;
    color:var(--danger);
    border-radius:12px;
    padding:11px 16px;
    font-weight:700;
}

.error{
    background:#fff0f0;
    color:var(--danger);
    padding:11px;
    border-radius:11px;
    font-size:14px;
    margin-bottom:15px;
    display:none;
}

/* APP */

.app{
    display:none;
    min-height:100vh;
}

.topbar{
    height:70px;
    background:var(--blue);
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-mark{
    width:40px;
    height:40px;
    border-radius:12px;
    border:1px solid var(--gold);
    color:var(--gold2);
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:900;
}

.brand strong{
    font-size:16px;
}

.user-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-name{
    font-size:13px;
    opacity:.85;
}

.logout{
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);
    color:white;
    border-radius:10px;
    padding:9px 12px;
}

.content{
    width:100%;
    max-width:1150px;
    margin:auto;
    padding:28px 20px 50px;
}

.page-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:25px;
}

.page-head h2{
    color:var(--blue);
    font-size:28px;
}

.page-head p{
    color:var(--muted);
    margin-top:5px;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    border-radius:999px;
    background:#eaf8f1;
    color:var(--success);
    font-size:12px;
    font-weight:800;
}

.status::before{
    content:"";
    width:7px;
    height:7px;
    background:currentColor;
    border-radius:50%;
}

/* CARDS */

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:20px;
}

.card-title{
    font-size:17px;
    font-weight:850;
    color:var(--blue);
    margin-bottom:17px;
}

/* ELECTION HEADER */

.election-banner{
    background:linear-gradient(135deg,var(--blue),var(--blue2));
    color:white;
    border-radius:22px;
    padding:28px;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
}

.election-banner::after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border:1px solid rgba(224,189,104,.22);
    border-radius:50%;
    right:-70px;
    top:-100px;
}

.election-banner .tag{
    color:var(--gold2);
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
}

.election-banner h1{
    font-size:30px;
    margin:8px 0;
}

.election-banner p{
    color:rgba(255,255,255,.75);
    max-width:700px;
}

/* PARTY CARDS */

.party-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.party{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    display:flex;
    gap:15px;
    align-items:center;
    transition:.2s;
}

.party:hover{
    border-color:var(--gold);
    transform:translateY(-2px);
    box-shadow:var(--shadow);
}

.party-img{
    width:82px;
    height:82px;
    border-radius:14px;
    background:#edf1f5;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    overflow:hidden;
    color:var(--muted);
    font-size:12px;
    text-align:center;
}

.party-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.party-info{
    flex
